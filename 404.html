<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seite nicht gefunden | HWA – Höhn Web & Automatisierung</title>
<meta name="robots" content="noindex">

<link rel="stylesheet" href="style.css">
<link rel="icon" href="assets/hwa-favicon/favicon.ico" sizes="any">
<link rel="icon" href="assets/hwa-favicon/favicon-32x32.png" type="image/png" sizes="32x32">
<link rel="icon" href="assets/hwa-favicon/favicon-16x16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="assets/hwa-favicon/apple-touch-icon.png">

<style>
  .error-page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px;
    background: var(--bg-dark);
    color: var(--text-on-dark);
  }
  .error-page .logo-img { height: 26px; margin-bottom: 56px; }
  .error-page .error-code {
    font-family: var(--font-display);
    font-size: clamp(56px, 10vw, 96px);
    font-weight: 600;
    color: var(--text-on-dark-secondary);
    margin: 0 0 16px;
    letter-spacing: -0.02em;
  }
  .error-page h1 {
    font-family: var(--font-display);
    font-size: clamp(24px, 3.5vw, 32px);
    font-weight: 600;
    margin: 0 0 16px;
  }
  .error-page p {
    font-size: 17px;
    color: var(--text-on-dark-secondary);
    max-width: 440px;
    margin: 0 0 40px;
  }
</style>
</head>
<body>

<div class="error-page">
  <img src="assets/logo-mark-light.png" alt="HWA – Höhn Web & Automatisierung" class="logo-img">
  <p class="error-code">404</p>
  <h1>Diese Seite gibt es nicht.</h1>
  <p>Der Link, dem Sie gefolgt sind, führt ins Leere – vielleicht wurde die Seite verschoben oder existiert nicht mehr.</p>
  <a href="/hwa-website/" class="btn btn-primary">Zur Startseite</a>
</div>

</body>
</html>
